<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ESP32 Bluetooth SketchPad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            touch-action: none;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas {
            cursor: crosshair;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden select-none">

    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between shadow-md z-10">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                <i class="fa-solid fa-bluetooth mr-2"></i>ESP32 BT Deck
            </span>
            <button id="bt-connect-btn" onclick="toggleBluetooth()" class="text-xs px-3 py-1.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 hover:bg-amber-500/30 transition flex items-center">
                <i class="fa-solid fa-circle text-[8px] mr-1.5 animate-pulse"></i>點擊連線藍牙
            </button>
        </div>

        <!-- 頂部快速巨集工具列 -->
        <div class="flex items-center space-x-2">
            <button onclick="sendMacro('UNDO')" class="bg-slate-700 hover:bg-slate-600 active:bg-cyan-600 px-3 py-2 rounded-xl text-sm font-medium transition shadow flex items-center">
                <i class="fa-solid fa-rotate-left mr-1"></i>復原
            </button>
            <button onclick="sendMacro('REDO')" class="bg-slate-700 hover:bg-slate-600 active:bg-cyan-600 px-3 py-2 rounded-xl text-sm font-medium transition shadow flex items-center">
                <i class="fa-solid fa-rotate-right mr-1"></i>重做
            </button>
            <button onclick="clearCanvas()" class="bg-rose-900/40 hover:bg-rose-900/60 border border-rose-700/50 text-rose-300 px-3 py-2 rounded-xl text-sm font-medium transition shadow">
                <i class="fa-solid fa-trash-can mr-1"></i>清除
            </button>
        </div>
    </header>

    <main class="flex-1 relative bg-slate-900 flex justify-center items-center overflow-hidden">
        <canvas id="drawCanvas" class="bg-white shadow-2xl rounded-lg"></canvas>
    </main>

    <footer class="bg-slate-800 border-t border-slate-700 p-4 flex flex-wrap items-center justify-between gap-4 z-10 shadow-lg">
        <!-- 工具切換 -->
        <div class="flex items-center space-x-2 bg-slate-900/60 p-1.5 rounded-2xl border border-slate-700">
            <button id="tool-brush" onclick="setTool('brush')" class="p-3 rounded-xl bg-cyan-600 text-white transition shadow flex items-center justify-center w-11 h-11">
                <i class="fa-solid fa-paintbrush text-lg"></i>
            </button>
            <button id="tool-eraser" onclick="setTool('eraser')" class="p-3 rounded-xl bg-slate-800 text-slate-400 hover:text-white transition shadow flex items-center justify-center w-11 h-11">
                <i class="fa-solid fa-eraser text-lg"></i>
            </button>
        </div>

        <!-- 顏色選擇器 -->
        <div class="flex items-center space-x-2 bg-slate-900/60 px-3 py-2 rounded-2xl border border-slate-700">
            <div class="flex space-x-1.5">
                <button onclick="setColor('#000000')" class="w-7 h-7 rounded-full bg-black border-2 border-slate-600 shadow-sm active:scale-95 transition"></button>
                <button onclick="setColor('#ef4444')" class="w-7 h-7 rounded-full bg-red-500 border-2 border-slate-600 shadow-sm active:scale-95 transition"></button>
                <button onclick="setColor('#3b82f6')" class="w-7 h-7 rounded-full bg-blue-500 border-2 border-slate-600 shadow-sm active:scale-95 transition"></button>
                <button onclick="setColor('#10b981')" class="w-7 h-7 rounded-full bg-emerald-500 border-2 border-slate-600 shadow-sm active:scale-95 transition"></button>
            </div>
            <input type="color" id="colorPicker" value="#000000" onchange="setColor(this.value)" class="w-8 h-8 rounded-lg bg-transparent cursor-pointer border-0">
        </div>

        <!-- 粗細調整 -->
        <div class="flex items-center space-x-3 bg-slate-900/60 px-4 py-2 rounded-2xl border border-slate-700 flex-1 max-w-xs">
            <i class="fa-solid fa-circle text-xs text-slate-400"></i>
            <input type="range" id="sizeRange" min="1" max="40" value="4" oninput="setBrushSize(this.value)" class="w-full accent-cyan-500 cursor-pointer">
            <span id="sizeDisplay" class="text-xs font-mono w-6 text-right text-slate-300">4px</span>
        </div>

        <!-- 自訂藍牙巨集按鈕 -->
        <div class="flex items-center space-x-2">
            <button onclick="sendMacro('LAYER')" class="bg-indigo-600/80 hover:bg-indigo-600 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition shadow flex items-center">
                <i class="fa-solid fa-layer-group mr-2"></i>圖層
            </button>
        </div>
    </footer>

    <script>
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');

        let isDrawing = false;
        let currentTool = 'brush';
        let currentColor = '#000000';
        let currentSize = 4;
        let lastX = 0;
        let lastY = 0;

        // Web Bluetooth 變數
        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;

        // 自訂 BLE 服務與特徵 UUID（需與 ESP32 端設定一致）
        const SERVICE_UUID = "12345678-1234-5678-1234-567890abcdef";
        const CHARACTERISTIC_UUID = "87654321-4321-6789-4321-abcdef987654";

        function initCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth - 32;
            canvas.height = container.clientHeight - 32;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        window.addEventListener('resize', () => {
            const tempImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const container = canvas.parentElement;
            canvas.width = container.clientWidth - 32;
            canvas.height = container.clientHeight - 32;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.putImageData(tempImage, 0, 0);
        });

        window.onload = () => { initCanvas(); };

        // 藍牙連線控制 (支援 Bluefy / Web Bluetooth)
        async function toggleBluetooth() {
            try {
                if (!bluetoothDevice || !bluetoothDevice.gatt.connected) {
                    const btn = document.getElementById('bt-connect-btn');
                    btn.innerHTML = '<i class="fa-solid fa-circle text-[8px] mr-1.5 animate-spin"></i>搜尋藍牙中...';
                    
                    bluetoothDevice = await navigator.bluetooth.requestDevice({
                        filters: [{ namePrefix: 'ESP32' }, { services: [SERVICE_UUID] }]
                    });

                    const server = await bluetoothDevice.gatt.connect();
                    const service = await server.getPrimaryService(SERVICE_UUID);
                    bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                    btn.className = "text-xs px-3 py-1.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 transition flex items-center";
                    btn.innerHTML = '<i class="fa-solid fa-circle text-[8px] mr-1.5"></i>藍牙已連線';
                    
                    bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
                } else {
                    if (bluetoothDevice.gatt.connected) {
                        bluetoothDevice.gatt.disconnect();
                    }
                }
            } catch (error) {
                console.log('Bluetooth Error: ', error);
                const btn = document.getElementById('bt-connect-btn');
                btn.className = "text-xs px-3 py-1.5 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30 transition flex items-center";
                btn.innerHTML = '<i class="fa-solid fa-circle text-[8px] mr-1.5"></i>連線失敗/取消';
            }
        }

        function onDisconnected() {
            const btn = document.getElementById('bt-connect-btn');
            btn.className = "text-xs px-3 py-1.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 transition flex items-center";
            btn.innerHTML = '<i class="fa-solid fa-circle text-[8px] mr-1.5"></i>藍牙已斷線';
        }

        // 透過藍牙發送指令
        async function sendMacro(action) {
            console.log('Sending BLE Macro:', action);
            if (bluetoothCharacteristic) {
                try {
                    const encoder = new TextEncoder();
                    await bluetoothCharacteristic.writeValue(encoder.encode(action));
                } catch (error) {
                    console.error('Failed to send BLE data:', error);
                }
            } else {
                console.log('BLE not connected, command simulated:', action);
            }
        }

        // 繪圖事件
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            
            if (currentTool === 'eraser') {
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = currentSize * 3;
            } else {
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = currentSize;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            }
            
            ctx.stroke();
            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing() { isDrawing = false; }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        function setTool(tool) {
            currentTool = tool;
            const brushBtn = document.getElementById('tool-brush');
            const eraserBtn = document.getElementById('tool-eraser');
            if (tool === 'brush') {
                brushBtn.className = "p-3 rounded-xl bg-cyan-600 text-white transition shadow flex items-center justify-center w-11 h-11";
                eraserBtn.className = "p-3 rounded-xl bg-slate-800 text-slate-400 hover:text-white transition shadow flex items-center justify-center w-11 h-11";
            } else {
                eraserBtn.className = "p-3 rounded-xl bg-cyan-600 text-white transition shadow flex items-center justify-center w-11 h-11";
                brushBtn.className = "p-3 rounded-xl bg-slate-800 text-slate-400 hover:text-white transition shadow flex items-center justify-center w-11 h-11";
            }
        }

        function setColor(color) {
            currentColor = color;
            document.getElementById('colorPicker').value = color;
            setTool('brush');
        }

        function setBrushSize(val) {
            currentSize = val;
            document.getElementById('sizeDisplay').innerText = val + 'px';
        }

        function clearCanvas() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
